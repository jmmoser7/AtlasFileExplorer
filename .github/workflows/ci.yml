name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # eframe/winit and rfd's xdg-portal backend need these to link on Linux.
      # The Cursor cloud image already carries them, which is why
      # .cursor/environment.json installs only the toolchain.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev

      # Mirrors .cursor/environment.json so local, cloud, and CI agree.
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: tests
          cache-on-failure: true

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Segmentation installer integrity
        run: python3 -B -m unittest discover -s scripts/tests -p test_setup_segmentation.py -v

      # Match the packaged Windows engine so document tests run on Linux too.
      - name: Install pinned Pdfium for document tests
        run: |
          curl --fail --location --retry 3 \
            https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/7920/pdfium-linux-x64.tgz \
            --output "$RUNNER_TEMP/pdfium.tgz"
          echo "49ab3afbd4e6c1e284b5f2898129c8bb8a10fd785c1c5392c8c1fc70242f9ced  $RUNNER_TEMP/pdfium.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/pdfium.tgz" -C vendor --strip-components=1 lib/libpdfium.so

      - name: Tests
        run: |
          set -o pipefail
          cargo test --locked --workspace --no-fail-fast 2>&1 | tee test-output.log

      # Reuse the warm test build for this bounded diagnostic. Dev CPU timings
      # identify cache behavior; they do not measure native input latency.
      - name: Measure synthetic pen cache working set (dev CPU)
        if: startsWith(github.head_ref, 'codex/slate-performance-audit-')
        env:
          SLATE_STRESS_LABEL: hosted-dev
          SLATE_CACHE_PROBE_FRAMES: 3
        run: |
          set -o pipefail
          cargo test --locked -p slate --lib bench_native_pen_cache_probe -- --ignored --nocapture --test-threads=1 2>&1 | tee path-cache-probe.log

      - name: Exercise large mixed boards (dev CPU)
        if: startsWith(github.head_ref, 'codex/slate-performance-audit-')
        timeout-minutes: 10
        env:
          SLATE_STRESS_LABEL: hosted-dev-large
          SLATE_STRESS_COUNTS: 5000,10000
          SLATE_STRESS_FRAMES: 10
        run: |
          set -o pipefail
          if [ -x /usr/bin/time ]; then
            /usr/bin/time -v cargo test --locked -p slate --lib bench_mixed_board -- --ignored --nocapture --test-threads=1 2>&1 | tee mixed-board-large.log
          else
            cargo test --locked -p slate --lib bench_mixed_board -- --ignored --nocapture --test-threads=1 2>&1 | tee mixed-board-large.log
          fi

      - name: Preserve synthetic pen cache diagnostics
        if: always() && startsWith(github.head_ref, 'codex/slate-performance-audit-')
        uses: actions/upload-artifact@v4
        with:
          name: slate-path-cache-dev-${{ github.sha }}
          path: |
            path-cache-probe.log
            target/slate-perf-audit/path-cache-probe-hosted-dev.json
            mixed-board-large.log
            target/slate-perf-audit/mixed-hosted-dev-large.json
          if-no-files-found: warn

      # Reuse the test build; this generated fake-host diagnostic includes real
      # egui tessellation but excludes WebView2, GPU submission and display.
      - name: Measure focused web portals on large canvases (dev CPU)
        if: github.head_ref == 'codex/slate-consolidation-20261021'
        timeout-minutes: 3
        env:
          SLATE_WEB_PERF_LABEL: hosted-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -o pipefail
          if [ -x /usr/bin/time ]; then
            /usr/bin/time -v timeout --kill-after=5s 115s cargo test --locked -p slate --lib app::bench_web::perf_probe::bench_web_large_canvas_cpu -- --ignored --exact --nocapture --test-threads=1 2>&1 | tee web-large-canvas.log
          else
            timeout --kill-after=5s 115s cargo test --locked -p slate --lib app::bench_web::perf_probe::bench_web_large_canvas_cpu -- --ignored --exact --nocapture --test-threads=1 2>&1 | tee web-large-canvas.log
          fi
          test -s "target/slate-web-perf-audit/web-large-canvas-${SLATE_WEB_PERF_LABEL}.json"

      - name: Preserve web CPU diagnostic
        if: always() && github.head_ref == 'codex/slate-consolidation-20261021'
        uses: actions/upload-artifact@v4
        with:
          name: slate-web-cpu-${{ github.sha }}
          path: |
            web-large-canvas.log
            target/slate-web-perf-audit/web-large-canvas-hosted-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: warn

      # Job logs need a signed-in account; annotations are public.
      - name: Name failing tests
        if: failure()
        run: |
          sed 's/\x1b\[[0-9;]*[A-Za-z]//g' test-output.log > test-plain.log || true
          grep -E ' \.\.\. FAILED$|^error: could not compile' test-plain.log | head -n 5 | sed 's/^/::error::/' || true
          grep -A 2 -E 'panicked at ' test-plain.log | grep -v '^--$' | head -n 5 | sed 's/^/::error::/' || true

  lint:
    name: clippy (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lint-

      - name: Clippy
        run: cargo clippy --workspace --all-targets --keep-going -- -D warnings

  windows:
    name: check (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-windows-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-windows-

      - name: Check
        run: cargo check --workspace
