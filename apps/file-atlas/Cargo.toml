[package]
name = "native-file-atlas"
version.workspace = true
edition.workspace = true
description = "File Atlas — native, high-performance visual file organizer"

[features]
default = []
ui-tuner = ["atlas-shell/ui-tuner"]

[dependencies]
atlas-core = { workspace = true }
atlas-update = { workspace = true }
atlas-shell = { workspace = true }
atlas-commands = { workspace = true }
atlas-session = { workspace = true }
atlas-ai = { workspace = true }
eframe = { workspace = true }
crossbeam-channel = { workspace = true }
rfd = { workspace = true }
raw-window-handle = "0.6"
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
