[package]
name = "slate"
version.workspace = true
edition.workspace = true
description = "Slate — tag-driven workbook dashboard for the Atlas ecosystem"

[features]
default = []
ui-tuner = ["atlas-shell/ui-tuner"]

[dependencies]
atlas-core = { workspace = true }
atlas-shell = { workspace = true }
atlas-commands = { workspace = true }
atlas-session = { workspace = true }
atlas-ai = { workspace = true }
slate-doc = { workspace = true }
slate-kit = { workspace = true }
slate-artifact = { workspace = true }
circle-pack = { workspace = true }
code-lens = { workspace = true }
repo-graph = { workspace = true }
rhino-mesh = { workspace = true }
vector-ink = { workspace = true }
native-file-atlas = { workspace = true }
eframe = { workspace = true }
crossbeam-channel = { workspace = true }
rfd = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Web portals: WebView2 rendered offscreen into a composition visual, captured
# to a D3D11 texture, and read back as an egui texture (board_web_win.rs).
# Pinned to the same `windows` generation as atlas-core so the tree holds one.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
windows-numerics = "0.2"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
    "Foundation",
    "Foundation_Numerics",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "System",
    "UI",
    "UI_Composition",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
]
