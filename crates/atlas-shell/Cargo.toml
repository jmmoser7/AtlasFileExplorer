[package]
name = "atlas-shell"
version.workspace = true
edition.workspace = true
description = "Shared UI chrome for the Atlas ecosystem: theme, tab strip, sidebar primitives, widgets, panel registry, command reference"

[features]
default = []
ui-tuner = []

[dependencies]
atlas-core = { workspace = true }
atlas-update = { workspace = true }
eframe = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
vector-ink = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_System_LibraryLoader"] }
