[package]
name = "vector-ink"
version.workspace = true
edition.workspace = true
description = "Renderer-agnostic vector stroke tessellation and path geometry (Draw / Phase 2)"
license = "MIT"

[lib]
name = "vector_ink"
path = "src/lib.rs"

[features]
# Default so `cargo test -p vector-ink` runs the tile parity tests. The
# feature also keeps this artifact distinct from other worktrees that share
# CARGO_TARGET_DIR and do not have the module.
default = ["brush-tiles"]
brush-tiles = []

[dependencies]
kurbo = { workspace = true }
i_overlay = { workspace = true }
earcutr = { workspace = true }
