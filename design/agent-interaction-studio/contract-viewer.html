<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio contract</title><style>
body{margin:0;padding:28px 32px;color:#283039;background:#fbfcfd;font:14px/1.6 system-ui,sans-serif}main{max-width:1080px;margin:auto}h1{font-size:25px;line-height:1.25}h2{font-size:19px;margin-top:32px;border-top:1px solid #dce1e6;padding-top:20px}h3{font-size:15px;margin-top:22px}p{max-width:85ch}a{color:#0f766e}code{background:#edf0f3;padding:1px 4px;font-size:12px}table{border-collapse:collapse;font-size:12px;width:100%;margin:18px 0}td,th{border:1px solid #dde2e7;padding:8px;text-align:left;vertical-align:top}th{background:#edf1f4}td:first-child{white-space:nowrap}ul,ol{padding-left:22px}li{margin-bottom:6px}@media(prefers-color-scheme:dark){body{background:#171c22;color:#dce2e9}code,th{background:#242c35}h2,td,th{border-color:#39424d}a{color:#64cdb9}}@media(max-width:650px){body{padding:18px}table{font-size:11px;display:block;overflow:auto}}
</style></head><body><main id="document">Loading contract…</main><script>
const allowed=/^contracts\/[a-z0-9-]+\.md$/;const path=new URLSearchParams(location.search).get('document')||'contracts/chat-train.md';
const escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inline=s=>escapeHtml(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\[([^\]]+)\]\(([^)]+)\)/g,(_,label,url)=>{try{if(url.startsWith('../../../'))return `<span title="Repository source reference">${label}</span>`;const u=new URL(url,new URL(path,location.href));return ['http:','https:'].includes(u.protocol)?`<a href="${escapeHtml(u.href)}" target="_blank" rel="noopener">${label}</a>`:label;}catch{return label;}});
function render(text){let html='',list='',table=false;const closeList=()=>{if(list){html+=`</${list}>`;list='';}};for(const line of text.split(/\r?\n/)){if(line.startsWith('|')){closeList();if(/^\|[- :|]+$/.test(line))continue;const cells=line.slice(1,-1).split('|').map(s=>inline(s.trim()));if(!table){html+='<table><thead><tr>'+cells.map(s=>`<th>${s}</th>`).join('')+'</tr></thead><tbody>';table=true;}else html+='<tr>'+cells.map(s=>`<td>${s}</td>`).join('')+'</tr>';continue;}if(table){html+='</tbody></table>';table=false;}const heading=/^(#{1,3}) (.*)$/.exec(line);if(heading){closeList();html+=`<h${heading[1].length}>${inline(heading[2])}</h${heading[1].length}>`;continue;}const item=/^(?:- |\d+\. )(.*)$/.exec(line);if(item){const type=/^\d/.test(line)?'ol':'ul';if(list!==type){closeList();html+=`<${type}>`;list=type;}html+=`<li>${inline(item[1])}</li>`;continue;}closeList();if(line.trim())html+=`<p>${inline(line)}</p>`;}closeList();if(table)html+='</tbody></table>';return html;}
if(allowed.test(path))fetch(path).then(r=>{if(!r.ok)throw Error('Contract unavailable');return r.text();}).then(t=>document.getElementById('document').innerHTML=render(t)).catch(()=>document.getElementById('document').textContent='The contract could not be loaded.');else document.getElementById('document').textContent='Invalid document path.';
</script></body></html>
