<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atlas ecosystem — status dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #0e1114;
  --bg-elev: #161b20;
  --bg-panel: #1a2128;
  --line: #2a333c;
  --ink: #d8d4c8;
  --muted: #8a9188;
  --teal: #3d9b8f;
  --teal-dim: #2a6b63;
  --amber: #c49a6c;
  --coral: #c45c4a;
  --ok: #6a9f7a;
  --grid: rgba(216,212,200,0.04);
  --radius: 6px;
  --font: "IBM Plex Sans", "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: var(--font);
  color: var(--ink);
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(61,155,143,0.12), transparent 55%),
    radial-gradient(900px 500px at 90% 0%, rgba(196,154,108,0.08), transparent 50%),
    var(--bg);
  line-height: 1.45;
  min-height: 100vh;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 48px 48px;
  z-index: 0;
  mask-image: linear-gradient(to bottom, #000 0%, #000 40%, transparent 100%);
}
a { color: var(--teal); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; padding: 0 20px 80px; }

/* Nav */
.nav {
  position: sticky; top: 0; z-index: 20;
  display: flex; gap: 4px; flex-wrap: wrap; align-items: center;
  padding: 10px 0;
  background: rgba(14,17,20,0.88);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  margin: 0 -20px; padding-left: 20px; padding-right: 20px;
}
.nav a {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 6px 10px;
  border-radius: 999px;
  text-decoration: none;
}
.nav a:hover, .nav a:focus { color: var(--ink); background: var(--bg-elev); }

/* Hero */
.hero { padding: 48px 0 28px; }
.eyebrow {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--teal);
  margin: 0 0 12px;
}
.hero h1 {
  font-size: clamp(2rem, 4vw, 2.75rem);
  font-weight: 700;
  letter-spacing: -0.03em;
  margin: 0 0 12px;
  line-height: 1.1;
}
.verdict {
  font-size: 1.125rem;
  max-width: 40em;
  color: var(--ink);
  margin: 0 0 8px;
}
.verdict strong { color: var(--amber); font-weight: 600; }
.meta-line {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--muted);
  margin: 0 0 28px;
}

.kpi-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 28px;
}
@media (max-width: 720px) {
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
}
.kpi {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 16px;
}
.kpi .label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}
.kpi .value {
  font-size: 1.75rem;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin-top: 4px;
}
.kpi .hint { font-size: 12px; color: var(--muted); margin-top: 2px; }
.kpi.warn .value { color: var(--coral); }
.kpi.ok .value { color: var(--ok); }
.kpi.signal .value { color: var(--teal); }

.score-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
@media (max-width: 720px) { .score-row { grid-template-columns: 1fr; } }
.score-card {
  background: var(--bg-panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
}
.score-card h3 {
  margin: 0 0 14px;
  font-size: 13px;
  font-family: var(--mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
}
.bar-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
.bar-row .name { width: 72px; font-family: var(--mono); font-size: 12px; color: var(--muted); flex-shrink: 0; }
.bar-track {
  flex: 1; height: 8px; background: var(--bg);
  border-radius: 4px; overflow: hidden; border: 1px solid var(--line);
}
.bar-fill {
  height: 100%; width: 0;
  background: linear-gradient(90deg, var(--teal-dim), var(--teal));
  border-radius: 4px;
  transition: width 0.9s cubic-bezier(.2,.8,.2,1);
}
.bar-fill.amber { background: linear-gradient(90deg, #8a6a42, var(--amber)); }
.bar-fill.low { background: linear-gradient(90deg, #5a3a35, var(--coral)); }
.bar-row .pct { width: 40px; text-align: right; font-family: var(--mono); font-size: 12px; color: var(--ink); }

/* Sections */
section { padding: 36px 0 8px; scroll-margin-top: 56px; }
section > h2 {
  font-size: 1.35rem;
  letter-spacing: -0.02em;
  margin: 0 0 6px;
  display: flex; align-items: baseline; gap: 12px;
}
section > h2 .tag {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  font-weight: 400;
  letter-spacing: 0.06em;
}
section > .lede {
  color: var(--muted);
  margin: 0 0 20px;
  max-width: 52em;
  font-size: 0.95rem;
}

.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.chip {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.04em;
  padding: 5px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}
.chip:hover { border-color: var(--muted); color: var(--ink); }
.chip.active {
  background: rgba(61,155,143,0.15);
  border-color: var(--teal);
  color: var(--teal);
}

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
@media (max-width: 800px) {
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
}

.panel {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 18px;
}
.panel h3 { margin: 0 0 8px; font-size: 1.05rem; }
.panel p, .panel li { font-size: 0.9rem; color: var(--muted); }
.panel ul { margin: 8px 0 0; padding-left: 1.1em; }
.panel li { margin: 3px 0; }
.badge {
  display: inline-block;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 3px;
  border: 1px solid var(--line);
  color: var(--muted);
  vertical-align: middle;
}
.badge.done { color: var(--ok); border-color: rgba(106,159,122,0.45); background: rgba(106,159,122,0.1); }
.badge.partial, .badge.core_landed, .badge.early_groundwork { color: var(--amber); border-color: rgba(196,154,108,0.45); background: rgba(196,154,108,0.1); }
.badge.open, .badge.not_started, .badge.sketched, .badge.deferred { color: var(--coral); border-color: rgba(196,92,74,0.4); background: rgba(196,92,74,0.08); }
.badge.critical { color: var(--amber); border-color: var(--amber); }

/* Phase / wave cards */
.timeline { display: flex; flex-direction: column; gap: 10px; }
.t-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--bg-elev);
  overflow: hidden;
  transition: border-color 0.2s ease;
}
.t-card:hover { border-color: var(--teal-dim); }
.t-card.critical-path { border-color: rgba(196,154,108,0.55); box-shadow: inset 3px 0 0 var(--amber); }
.t-head {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 14px 16px;
  cursor: pointer;
  user-select: none;
}
.t-head .id {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--teal);
  min-width: 36px;
}
.t-head .title { font-weight: 600; flex: 1; min-width: 140px; }
.t-head .prog {
  width: 120px; height: 6px;
  background: var(--bg);
  border-radius: 3px;
  overflow: hidden;
  border: 1px solid var(--line);
}
.t-head .prog > i {
  display: block; height: 100%; width: 0;
  background: var(--teal);
  transition: width 0.8s cubic-bezier(.2,.8,.2,1);
}
.t-body {
  display: none;
  padding: 0 16px 16px;
  border-top: 1px solid var(--line);
  background: var(--bg-panel);
}
.t-card.open .t-body { display: block; animation: fadeIn 0.25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.t-body .summary { color: var(--muted); font-size: 0.9rem; margin: 12px 0; }
.task-list { list-style: none; padding: 0; margin: 0; }
.task-list li {
  display: grid;
  grid-template-columns: 64px 1fr auto;
  gap: 10px;
  align-items: start;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
  font-size: 0.88rem;
}
.task-list li:last-child { border-bottom: 0; }
.task-list .tid { font-family: var(--mono); font-size: 11px; color: var(--teal); }
.task-list .meta { font-family: var(--mono); font-size: 10px; color: var(--muted); text-align: right; }

/* Articles / decisions / deviations */
.art-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.art-card {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  min-height: 120px;
  transition: transform 0.2s ease, border-color 0.2s ease;
}
.art-card:hover { transform: translateY(-2px); border-color: var(--teal-dim); }
.art-card .aid {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--teal);
  letter-spacing: 0.08em;
}
.art-card h3 { margin: 4px 0 8px; font-size: 0.98rem; }
.art-card p { margin: 0; font-size: 0.82rem; color: var(--muted); }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  background: var(--bg-panel);
  font-weight: 500;
}
tr:last-child td { border-bottom: 0; }
tr:hover td { background: rgba(61,155,143,0.04); }
td.mono, .mono { font-family: var(--mono); font-size: 0.8rem; }
.status-open { color: var(--coral); }
.status-closed { color: var(--ok); }

.crate-bars { display: flex; flex-direction: column; gap: 6px; }
.crate-row { display: grid; grid-template-columns: 140px 1fr 56px; gap: 10px; align-items: center; font-size: 12px; }
.crate-row .cname { font-family: var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crate-row .cbar { height: 7px; background: var(--bg); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.crate-row .cbar > i { display: block; height: 100%; background: var(--teal); transition: width 0.8s cubic-bezier(.2,.8,.2,1); }
.crate-row .cbar > i.app { background: var(--amber); }
.crate-row .cbar > i.chrome { background: #7a8fa3; }
.crate-row .cloc { font-family: var(--mono); text-align: right; color: var(--ink); }

.next-list { counter-reset: next; list-style: none; padding: 0; margin: 0; }
.next-list li {
  counter-increment: next;
  display: grid;
  grid-template-columns: 36px 1fr;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}
.next-list li::before {
  content: counter(next);
  font-family: var(--mono);
  font-size: 1.25rem;
  color: var(--teal);
  font-weight: 600;
}
.next-list h4 { margin: 0 0 4px; font-size: 1rem; }
.next-list p { margin: 0; color: var(--muted); font-size: 0.9rem; }

.footer {
  margin-top: 48px;
  padding-top: 20px;
  border-top: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
}
.callout {
  border-left: 3px solid var(--amber);
  background: rgba(196,154,108,0.08);
  padding: 12px 16px;
  margin: 16px 0;
  font-size: 0.9rem;
}
.callout strong { color: var(--amber); }

@media print {
  body::before, .nav { display: none; }
  .t-body { display: block !important; }
  body { background: #fff; color: #111; }
  .panel, .t-card, .kpi, .art-card { break-inside: avoid; border-color: #ccc; background: #fff; }
}
</style>

function pct(x) { return Math.round((x || 0) * 100); }
function barClass(p) {
  if (p >= 0.85) return '';
  if (p >= 0.35) return 'amber';
  return 'low';

function badge(status) {
  const s = (status || 'unknown').replace(/\s+/g, '_');
  return `<span class="badge ${s}">${status}</span>`;
}
function esc(t) {
  return String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function barRow(name, v) {
  const p = pct(v);
  return `<div class="bar-row"><span class="name">${esc(name)}</span>
    <div class="bar-track"><div class="bar-fill ${barClass(v)}" data-w="${p}"></div></div>
    <span class="pct">${p}%</span></div>`;
}

function renderMain() {
  const main = document.getElementById('main');

function secMetrics() {
  const b = S.metrics.baseline;

  return `<section id="metrics">
    <h2>Metrics <span class="tag">Art. I pure_ratio canary</span></h2>

        <tr><td>pure_ratio</td><td class="mono">${b.pure_ratio}</td><td class="mono">— (re-run xtask)</td></tr>
        <tr><td>crates</td><td class="mono">${b.crates}</td><td class="mono">${a.crates}</td></tr>
        <tr><td>tests</td><td class="mono">${b.tests}</td><td class="mono">${a.tests}</td></tr>
        <tr><td>format_version</td><td class="mono">${b.format_version}</td><td class="mono">${a.format_version}</td></tr>
        <tr><td>node_kinds</td><td class="mono">${b.node_kinds}</td><td class="mono">${a.node_kinds} (${esc(a.node_kind_names.join(', '))})</td></tr>
        <tr><td>scene_cmd variants</td><td class="mono">${b.scene_cmd_variants}</td><td class="mono">${a.scene_cmd_variants} — ${esc(a.scene_cmd_shape)}</td></tr>
        <tr><td>commands slate / atlas</td><td class="mono">${b.commands_slate} / ${b.commands_file_atlas}</td><td class="mono">${a.commands_slate_approx} / ${a.commands_file_atlas_approx} (approx)</td></tr>
        <tr><td>deviations open</td><td class="mono">${b.deviations_open}</td><td class="mono">${a.deviations_open}</td></tr>
      </tbody>
    </table></div>
    <h3 style="margin:24px 0 12px;font-size:1rem">Crate LOC (approx code lines)</h3>
    <div class="crate-bars">
      ${S.metrics.crate_loc_approx.map(c => {
        const w = Math.round(c.lines_code / maxLoc * 100);
        const cls = c.kind === 'app' ? 'app' : c.kind === 'chrome' ? 'chrome' : '';
        return `<div class="crate-row" title="${esc(c.kind)}">
          <span class="cname">${esc(c.name)}</span>
          <div class="cbar"><i class="${cls}" data-w="${w}"></i></div>
          <span class="cloc">${c.lines_code.toLocaleString()}</span>
        </div>`;
      }).join('')}
    </div>
  </section>`;
}

function bindTimeline() {
  document.querySelectorAll('.t-card .t-head').forEach(h => {
    h.addEventListener('click', () => h.parentElement.classList.toggle('open'));
  });
  // Open critical path + first incomplete by default
  const crit = document.querySelector('.t-card.critical-path');
  if (crit) crit.classList.add('open');
}

function bindDeviationFilter() {
  const filters = document.getElementById('dev-filters');
  if (!filters) return;
  filters.addEventListener('click', e => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    filters.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    const f = btn.dataset.f;
    document.querySelectorAll('#dev-body tr').forEach(tr => {
      tr.style.display = (f === 'all' || tr.dataset.status === f) ? '' : 'none';
    });
  });
}
