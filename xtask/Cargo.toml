[package]
name = "xtask"
version.workspace = true
edition.workspace = true
description = "Workspace automation: `cargo xtask metrics` records the repository's drift baseline"
publish = false

[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
syn = { workspace = true }
